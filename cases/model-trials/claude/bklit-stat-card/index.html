<!doctype html>
<!-- ui-recast reproduction of bklit stat-card-area-01 + stat-card-line-01
     Evidence: /tmp/c4-statcard/upstream/*.tsx (block sources, MIT),
     bklit.com/r/stat-card-{area,line}-01-example.json + block json (data, example shell),
     bklit-ui@cfaa1d0a packages/ui/src/charts/{sparkline,sparkline-geometry,chart-stat-flow,animation}.ts(x),
     packages/studio/src/styles/bklit-tokens.css (token values). See record.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat Card — ui-recast reproduction</title>
<style>
  /* ---- tokens (bklit-tokens.css light values; dark block inferred from the same file) ---- */
  :root {
    --background: #ffffff;
    --foreground: oklch(0.145 0 0);
    --card: #ffffff;
    --card-border: oklch(0.922 0 0);
    --chart-1: #6366f1;            /* var(--color-indigo-500) */
    --chart-3: #d946ef;            /* var(--color-fuchsia-500) */
    --chart-crosshair: oklch(0.677 0 72.411);
    --chart-label: oklch(0.45 0.01 260);
    --emerald: #059669;            /* emerald-600 */
    --emerald-soft: rgba(16, 185, 129, 0.1);
    --emerald-border: rgba(16, 185, 129, 0.2);
    --destructive: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-border: oklch(0.274 0 0);
      --chart-1: #818cf8;          /* inferred: indigo-400 */
      --chart-3: #e879f9;          /* inferred: fuchsia-400 */
      --chart-crosshair: oklch(0.72 0.0158 281.84);
      --chart-label: oklch(0.75 0.01 260);
      --emerald: #34d399;          /* emerald-400, per trend-badge dark class */
      --emerald-soft: rgba(52, 211, 153, 0.1);
      --emerald-border: rgba(52, 211, 153, 0.2);
      --destructive: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  /* example shell: main flex min-h-svh items-center justify-center p-6 md:p-10 */
  .wrap { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  @media (min-width: 768px) { .wrap { padding: 40px; } }
  .cards { width: 100%; max-width: 448px; display: flex; flex-direction: column; gap: 24px; }

  /* ---- shadcn Card (new-york v4): rounded-xl border bg-card shadow-sm; bklit sets gap-0 py-0 ---- */
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); display: flex; flex-direction: column; }
  .card-header { position: relative; padding: 12px 16px; }
  .card-title { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0; line-height: 1.42857; }
  .card-title + .badge { position: absolute; top: 12px; right: 16px; }
  .card-content-area { display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 12px; }
  .card-content-line { padding: 8px 16px 12px; }

  /* ---- TrendBadge ---- */
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px;
    border: 1px solid var(--emerald-border); background: var(--emerald-soft); color: var(--emerald);
    font-size: 12px; font-weight: 500; line-height: 1.333; padding: 2px 8px; white-space: nowrap; }
  .badge.negative { border-color: transparent; background: var(--destructive); color: #fff; }
  .badge svg { width: 12px; height: 12px; flex: none; }

  /* ---- ChartStatFlow ---- */
  .stat { display: block; }
  .stat-value { font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--foreground); }
  .stat-label { display: block; margin-top: 2px; font-size: 12px; line-height: 1.333; color: var(--chart-label); }

  /* ---- StatCardChart: relative -mx-4 -mb-3 overflow-hidden, height 190px ---- */
  .chart-bleed { position: relative; margin: 0 -16px -12px; overflow: hidden; }
  .chart-bleed > .spark { height: 190px; }
  .chart-bleed > svg { display: block; }
  .overlay-stat { position: absolute; right: 16px; bottom: 16px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end; text-align: right; pointer-events: none; }
</style>
</head>
<body>
<main class="wrap">
  <div class="cards">

    <!-- stat-card-area-01 -->
    <section class="card" aria-label="Total Revenue stat card with area sparkline">
      <header class="card-header">
        <h2 class="card-title">Total Revenue</h2>
        <span class="badge" id="area-badge" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"></svg><span class="badge-text"></span></span>
      </header>
      <div class="card-content-area">
        <div class="stat">
          <span class="stat-value" id="area-value">$6,525</span>
          <span class="stat-label" id="area-label">Avg</span>
        </div>
        <div class="chart-bleed" id="area-chart"></div>
      </div>
    </section>

    <!-- stat-card-line-01 -->
    <section class="card" aria-label="Active Sessions stat card with line sparkline">
      <header class="card-header">
        <h2 class="card-title">Active Sessions</h2>
        <span class="badge" id="line-badge" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"></svg><span class="badge-text"></span></span>
      </header>
      <div class="card-content-line">
        <div class="chart-bleed" id="line-chart">
          <div class="overlay-stat">
            <span class="stat-value" id="line-value">1,344</span>
            <span class="stat-label" id="line-label">Avg</span>
          </div>
        </div>
      </div>
    </section>

  </div>
</main>

<script>
"use strict";
/* ============ evidence: registry data (bklit.com/r/stat-card-*-01.json) ============ */
const revenueSeries = [
  { date: "2024-01-01", value: 5200 }, { date: "2024-02-01", value: 6100 },
  { date: "2024-03-01", value: 5400 }, { date: "2024-04-01", value: 4700 },
  { date: "2024-05-01", value: 5100 }, { date: "2024-06-01", value: 6800 },
  { date: "2024-07-01", value: 6400 }, { date: "2024-08-01", value: 7200 },
  { date: "2024-09-01", value: 6900 }, { date: "2024-10-01", value: 8100 },
  { date: "2024-11-01", value: 7600 }, { date: "2024-12-01", value: 8800 },
];
const revenueStats = { average: revenueSeries.reduce((s, p) => s + p.value, 0) / revenueSeries.length, trend: 12.4 };
const sessionsSeries = [
  { date: "2024-06-03", value: 920 },  { date: "2024-06-04", value: 1380 },
  { date: "2024-06-05", value: 1120 }, { date: "2024-06-06", value: 1580 },
  { date: "2024-06-07", value: 1240 }, { date: "2024-06-08", value: 1710 },
  { date: "2024-06-09", value: 1460 },
];
const sessionsStats = { average: sessionsSeries.reduce((s, p) => s + p.value, 0) / sessionsSeries.length, trend: 8.2 };

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ENTER_MS = 900;                                  // DEFAULT_SPARKLINE_ANIMATION_DURATION_MS
const ENTER_EASE = "cubic-bezier(0.85, 0, 0.15, 1)";   // DEFAULT_ANIMATION_EASING
const HOVER_FADE = "opacity 400ms ease-in-out";        // HOVER_FADE
const SPRING = { stiffness: 300, damping: 30 };        // DEFAULT_SPARKLINE_HOVER_SPRING

/* ============ geometry port (sparkline-geometry.ts) ============ */
function layout(values, width, height, domain) {
  const [d0, d1] = domain, inner = height;
  const yOf = v => inner - ((v - d0) / (d1 - d0)) * inner;
  const step = values.length > 1 ? width / (values.length - 1) : 0;
  const points = values.map((value, i) => ({ x: step * i, y: yOf(value), value }));
  const baseline = Math.min(Math.max(0, d0), d1);
  return { points, baselineY: yOf(baseline) };
}
function headroomDomain(values) {          // stat cards pass ±5% headroom explicitly
  const min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min) * 0.05;
  return [min - pad, max + pad];
}
/* d3 curveMonotoneX (Fritsch–Carlson), ported */
function monotonePath(points) {
  const n = points.length;
  if (n < 2) return "";
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const dx = [], s = [];
  for (let i = 0; i < n - 1; i++) { dx.push(xs[i + 1] - xs[i]); s.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i])); }
  const m = [s[0]];
  for (let i = 1; i < n - 1; i++) {
    if (s[i - 1] * s[i] <= 0) m.push(0);
    else m.push(3 * (dx[i] + dx[i - 1]) / ((2 * dx[i] + dx[i - 1]) / s[i - 1] + (dx[i] + 2 * dx[i - 1]) / s[i]));
  }
  m.push(s[n - 2]);
  let d = `M${xs[0]},${ys[0]}`;
  for (let i = 0; i < n - 1; i++) {
    const cx1 = xs[i] + dx[i] / 3, cy1 = ys[i] + m[i] * dx[i] / 3;
    const cx2 = xs[i + 1] - dx[i] / 3, cy2 = ys[i + 1] - m[i + 1] * dx[i] / 3;
    d += `C${cx1},${cy1} ${cx2},${cy2} ${xs[i + 1]},${ys[i + 1]}`;
  }
  return d;
}
function describeSparkline(values) {       // upstream describeSparkline
  const finite = values.filter(Number.isFinite);
  const first = finite[0], last = finite.at(-1);
  const fmt = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 2 });
  let out = `${finite.length} points, from ${fmt.format(first)} to ${fmt.format(last)}`;
  if (first !== 0) {
    const change = ((last - first) / Math.abs(first)) * 100;
    out += `, ${change >= 0 ? "up" : "down"} ${Math.abs(Math.round(change))}%`;
  }
  return out;
}

/* ============ spring (crosshair x, dot x/y) ============ */
function springTo(state, target, t) {
  const steps = Math.max(1, Math.round(t / (1000 / 120)));
  const dt = (t / 1000) / steps;
  for (let i = 0; i < steps; i++) {
    const a = SPRING.stiffness * (target - state.v) - SPRING.damping * state.vel;
    state.vel += a * dt;
    state.v += state.vel * dt;
  }
}

/* ============ NumberFlow substitute: interpolated tabular counter ============ */
function makeCounter(el, format) {
  let from = null, start = 0, raf = 0, target = null, shown = null;
  const draw = now => {
    const t = Math.min(1, (now - start) / 400);
    const eased = 1 - Math.pow(1 - t, 3);
    const value = from + (target - from) * eased;
    el.textContent = format(value);
    if (t < 1) raf = requestAnimationFrame(draw); else shown = target;
  };
  return value => {
    if (target === null || reduceMotion) { target = value; from = value; el.textContent = format(value); return; }
    if (value === target) return;
    from = shown ?? value; target = value; start = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  };
}

/* ============ TrendBadge ============ */
const TREND_UP = '<path d="M12 20.25V4.5"/><path d="M5.75 10L12 3.75L18.25 10"/>';
const TREND_DOWN = '<path d="M18.25 14L12 20.25L5.75 14"/><path d="M12 19.5V3.75"/>';
function setBadge(el, value) {
  el.hidden = false;
  const positive = value >= 0;
  el.classList.toggle("negative", !positive);
  el.querySelector("svg").innerHTML = positive ? TREND_UP : TREND_DOWN;
  el.querySelector(".badge-text").textContent = `${positive ? "+" : ""}${value.toFixed(1)}%`;
}

/* ============ sparkline engine (sparkline.tsx behavior, vanilla) ============ */
function createSparkline(host, { series, variant, color, strokeWidth, inactiveOpacity, formatLabel, onIndex }) {
  const values = series.map(p => p.value);
  const domain = headroomDomain(values);
  const height = 190;
  const NS = "http://www.w3.org/2000/svg";
  // the engine owns a .spark layer; other host children (the line card's overlay) stay untouched
  let spark = host.querySelector(":scope > .spark");
  if (!spark) { spark = document.createElement("div"); spark.className = "spark"; host.appendChild(spark); }
  spark.innerHTML = "";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", describeSparkline(values));
  svg.style.touchAction = "pan-y";
  spark.appendChild(svg);
  const uid = "g" + Math.random().toString(36).slice(2, 8);

  const mk = (tag, attrs) => { const node = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v); return node; };
  const group = mk("g", {});          // base series group (dims on hover)
  const fxGroup = mk("g", {});        // crosshair line only (translates); dot is a sibling (upstream structure)
  const dot = mk("circle", { r: 3, fill: color, stroke: "var(--card)", "stroke-width": 1.5, "pointer-events": "none" });
  dot.style.display = "none";
  const crossRect = mk("rect", { width: 1, height: height, x: -0.5, y: 0, fill: "", "pointer-events": "none" });
  crossRect.style.display = "none";
  fxGroup.append(crossRect);
  group.style.transition = HOVER_FADE;

  let linePath, areaPath, fillDefs = "";
  const stateX = { v: 0, vel: 0 }, stateY = { v: 0, vel: 0 };
  let hoverIndex = null, raf = 0, width = 0, points = [];

  function build() {
    width = host.clientWidth;
    if (width <= 0) return;
    const geo = layout(values, width, height, domain);
    points = geo.points;
    const d = monotonePath(points);
    linePath = d;
    areaPath = variant === "area" ? `${d}L${points.at(-1).x},${geo.baselineY}L${points[0].x},${geo.baselineY}Z` : "";
    fillDefs = variant === "area"
      ? `<linearGradient id="${uid}" x1="0" x2="0" y1="0" y2="1">
           <stop offset="0" stop-color="${color}" stop-opacity="0.45"/>
           <stop offset="1" stop-color="${color}" stop-opacity="0"/>
         </linearGradient>
         <linearGradient id="${uid}-x" x1="0" x2="0" y1="0" y2="1">
           <stop offset="0" stop-color="var(--chart-crosshair)" stop-opacity="0"/>
           <stop offset="0.5" stop-color="var(--chart-crosshair)" stop-opacity="1"/>
           <stop offset="1" stop-color="var(--chart-crosshair)" stop-opacity="0"/>
         </linearGradient>` : "";
    crossRect.setAttribute("fill", `url(#${uid}-x)`);
    render();
  }
  function render() {
    svg.setAttribute("width", width); svg.setAttribute("height", height);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    const area = variant === "area" ? `<path d="${areaPath}" fill="url(#${uid})"/>` : "";
    group.innerHTML = `${area}<path d="${linePath}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"
        stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="line"/>`;
    svg.innerHTML = `<defs>${fillDefs}</defs>`;
    svg.append(group, fxGroup, dot);
    if (!entered) {
      entered = true;
      if (!reduceMotion) {
        if (variant === "area") {
          // area wipes in left → right on its group
          group.style.clipPath = "inset(0 100% 0 0)";
          group.animate([{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)" }],
            { duration: ENTER_MS, easing: ENTER_EASE, fill: "forwards" });
        } else {
          // line draws in along its stroke
          const line = group.querySelector("path");
          line.style.strokeDasharray = "1";
          line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
            { duration: ENTER_MS, easing: ENTER_EASE, fill: "forwards" });
        }
      }
    }
  }
  let entered = false;

  function applyHover() {
    group.style.opacity = hoverIndex === null ? 1 : inactiveOpacity;
    const show = hoverIndex !== null;
    crossRect.style.display = show ? "" : "none";
    dot.style.display = show ? "" : "none";
    if (show) {
      const p = points[hoverIndex];
      const tick = () => {
        fxGroup.setAttribute("transform", `translate(${stateX.v},0)`);
        dot.setAttribute("cx", stateX.v); dot.setAttribute("cy", stateY.v);
        const doneX = Math.abs(stateX.v - p.x) < 0.5 && Math.abs(stateY.v - p.y) < 0.5;
        if (!doneX) { springTo(stateX, p.x, 16); springTo(stateY, p.y, 16); raf = requestAnimationFrame(tick); }
      };
      cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
    } else cancelAnimationFrame(raf);
    onIndex(hoverIndex);
  }
  svg.addEventListener("pointermove", event => {
    const rect = svg.getBoundingClientRect();
    const t = (event.clientX - rect.left) / width;
    const index = Math.min(values.length - 1, Math.max(0, Math.round(t * (values.length - 1))));
    if (index !== hoverIndex) { hoverIndex = index; applyHover(); }
  });
  svg.addEventListener("pointerleave", () => { hoverIndex = null; applyHover(); });

  new ResizeObserver(build).observe(host);
  build();
  onIndex(null);   // mount state: Avg + overall trend (upstream renders displayTrend ?? stats.trend)
}

/* ============ cards ============ */
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const int = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const month = date => new Date(date).toLocaleDateString("en-US", { month: "short" });
const weekday = date => new Date(date).toLocaleDateString("en-US", { weekday: "long" });
const trend = (series, i) => i <= 0 ? null : ((series[i].value - series[i - 1].value) / series[i - 1].value) * 100;

const areaValue = makeCounter(document.getElementById("area-value"), v => usd.format(v));
const areaLabel = document.getElementById("area-label");
const areaBadge = document.getElementById("area-badge");
createSparkline(document.getElementById("area-chart"), {
  series: revenueSeries, variant: "area", color: "var(--chart-1)", strokeWidth: 2, inactiveOpacity: 0.5,
  formatLabel: month,
  onIndex: i => {
    const hoverValue = i === null ? null : revenueSeries[i].value;
    areaValue(hoverValue ?? revenueStats.average);
    areaLabel.textContent = i === null ? "Avg" : month(revenueSeries[i].date);
    setBadge(areaBadge, i === null || trend(revenueSeries, i) === null ? revenueStats.trend : trend(revenueSeries, i));
  },
});

const lineValue = makeCounter(document.getElementById("line-value"), v => int.format(Math.round(v)));
const lineLabel = document.getElementById("line-label");
const lineBadge = document.getElementById("line-badge");
createSparkline(document.getElementById("line-chart"), {
  series: sessionsSeries, variant: "line", color: "var(--chart-3)", strokeWidth: 2.5, inactiveOpacity: 0.4,
  formatLabel: weekday,
  onIndex: i => {
    const hoverValue = i === null ? null : sessionsSeries[i].value;
    lineValue(hoverValue ?? Math.round(sessionsStats.average));
    lineLabel.textContent = i === null ? "Avg" : weekday(sessionsSeries[i].date);
    setBadge(lineBadge, i === null || trend(sessionsSeries, i) === null ? sessionsStats.trend : trend(sessionsSeries, i));
  },
});
</script>
</body>
</html>
